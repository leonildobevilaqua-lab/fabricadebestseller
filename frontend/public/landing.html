 src: url(\"35447c82-f917-45f7-8de8-611db26ca928\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n  /* ============ RESET ============ */\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }\n  body {\n    font-family: 'DM Sans', system-ui, sans-serif;\n    background: #0D0D0D;\n    color: #E8E4DC;\n    line-height: 1.6;\n    font-weight: 400;\n    overflow-x: hidden;\n    font-feature-settings: \"ss01\", \"cv02\";\n  }\n  img { max-width: 100%; display: block; }\n  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }\n  a { color: inherit; text-decoration: none; }\n\n  /* ============ TOKENS ============ */\n  :root {\n    --bg-0: #0D0D0D;\n    --bg-1: #151515;\n    --bg-2: #1C1C1C;\n    --bg-3: #232323;\n    --line: rgba(212, 160, 23, 0.18);\n    --line-strong: rgba(212, 160, 23, 0.38);\n    --gold: #D4A017;\n    --gold-light: #F0C040;\n    --gold-deep: #B8860C;\n    --ink: #E8E4DC;\n    --ink-dim: #A8A199;\n    --ink-mute: #6E6960;\n    --red: #C7372F;\n    --red-soft: rgba(199, 55, 47, 0.08);\n    --green: #4F8C5A;\n    --serif: 'Playfair Display', Georgia, serif;\n    --sans: 'DM Sans', system-ui, sans-serif;\n    --mono: 'JetBrains Mono', monospace;\n    --maxw: 1240px;\n    --radius: 14px;\n  }\n\n  /* ============ TYPOGRAPHY ============ */\n  .eyebrow {\n    font-family: var(--mono);\n    font-size: 12px;\n    font-weight: 500;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--gold);\n  }\n  .display {\n    font-family: var(--serif);\n    font-weight: 700;\n    line-height: 1.05;\n    letter-spacing: -0.02em;\n    color: #F5F0E5;\n    text-wrap: balance;\n  }\n  .h1 { font-size: clamp(36px, 6vw, 68px); }\n  .h2 { font-size: clamp(32px, 4.6vw, 52px); }\n  .h3 { font-size: clamp(24px, 3vw, 34px); }\n  .lede { font-size: clamp(17px, 1.6vw, 20px); color: var(--ink-dim); line-height: 1.6; text-wrap: pretty; }\n  .gold { color: var(--gold-light); }\n  em.serif-italic { font-family: var(--serif); font-style: italic; color: var(--gold-light); font-weight: 400; }\n\n  /* ============ LAYOUT ============ */\n  .container { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }\n  section { padding: clamp(56px, 6.5vw, 96px) 0; position: relative; }\n  .section-head { text-align: center; max-width: 820px; margin: 0 auto clamp(36px, 4.2vw, 60px); }\n  .section-head .eyebrow { margin-bottom: 18px; display: inline-block; }\n  .section-head .lede { margin-top: 22px; }\n\n  /* ============ NAVBAR ============ */\n  .nav {\n    position: fixed; top: 0; left: 0; right: 0; z-index: 100;\n    background: rgba(13, 13, 13, 0.72);\n    backdrop-filter: blur(18px) saturate(140%);\n    -webkit-backdrop-filter: blur(18px) saturate(140%);\n    border-bottom: 1px solid transparent;\n    transition: border-color 0.3s, background 0.3s;\n  }\n  .nav.scrolled { border-bottom-color: var(--line); background: rgba(13, 13, 13, 0.92); }\n  .nav-inner {\n    max-width: var(--maxw); margin: 0 auto;\n    padding: 16px 24px;\n    display: flex; align-items: center; justify-content: space-between;\n    gap: 16px;\n  }\n  .logo {\n    font-family: var(--serif);\n    font-size: 22px;\n    font-weight: 700;\n    letter-spacing: -0.01em;\n    color: #F5F0E5;\n    display: flex; align-items: center; gap: 12px;\n  }\n  .logo-img {\n    height: 38px;\n    width: auto;\n    display: block;\n    filter: drop-shadow(0 2px 10px rgba(212, 160, 23, 0.28));\n    transition: transform 0.2s;\n  }\n  .logo:hover .logo-img { transform: scale(1.04); }\n  .logo-mark {\n    width: 30px; height: 30px;\n    border: 1px solid var(--gold);\n    border-radius: 50%;\n    display: grid; place-items: center;\n    color: var(--gold-light);\n    flex-shrink: 0;\n  }\n  .logo-mark svg { width: 16px; height: 16px; }\n  .logo em { font-style: italic; font-weight: 400; color: var(--gold-light); }\n  .nav-actions { display: flex; align-items: center; gap: 18px; }\n  .lang-switch {\n    display: flex; gap: 2px;\n    background: rgba(255,255,255,0.04);\n    border: 1px solid rgba(255,255,255,0.06);\n    border-radius: 999px;\n    padding: 4px;\n  }\n  .lang-switch button {\n    font-family: var(--mono);\n    font-size: 11px;\n    font-weight: 500;\n    letter-spacing: 0.08em;\n    padding: 6px 12px;\n    border-radius: 999px;\n    color: var(--ink-mute);\n    transition: all 0.2s;\n  }\n  .lang-switch button.active {\n    background: var(--gold);\n    color: #0D0D0D;\n  }\n  .lang-switch button:not(.active):hover { color: var(--ink); }\n\n  /* ============ BUTTONS ============ */\n  .btn {\n    display: inline-flex; align-items: center; justify-content: center; gap: 10px;\n    padding: 14px 22px;\n    border-radius: 8px;\n    font-family: var(--sans);\n    font-weight: 600;\n    font-size: 14px;\n    letter-spacing: 0.01em;\n    line-height: 1.2;\n    transition: transform 0.18s ease, box-shadow 0.2s ease, background 0.2s ease;\n    cursor: pointer;\n    white-space: nowrap;\n    text-align: center;\n  }\n  .btn-gold {\n    background: linear-gradient(180deg, #F0C040 0%, #D4A017 100%);\n    color: #1A1408;\n    box-shadow: 0 0 0 1px rgba(240,192,64,0.5) inset, 0 8px 30px -8px rgba(212,160,23,0.55);\n  }\n  .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(240,192,64,0.7) inset, 0 12px 36px -8px rgba(212,160,23,0.7); }\n  .btn-gold-outline {\n    background: transparent;\n    color: var(--gold-light);\n    box-shadow: inset 0 0 0 1px var(--gold);\n  }\n  .btn-gold-outline:hover { background: rgba(212,160,23,0.08); }\n  .btn-lg { padding: 18px 28px; font-size: 16px; border-radius: 10px; }\n  .btn-xl { padding: 22px 36px; font-size: 18px; border-radius: 12px; }\n  .btn-nav { padding: 11px 18px; font-size: 13px; }\n  .cta-micro {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.06em;\n    color: var(--ink-mute);\n    margin-top: 14px;\n    text-transform: uppercase;\n  }\n\n  /* ============ HERO ============ */\n  .hero {\n    padding-top: clamp(100px, 12vw, 140px);\n    padding-bottom: clamp(56px, 7vw, 84px);\n    position: relative;\n    overflow: hidden;\n  }\n  .hero-shader {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    z-index: 0;\n    pointer-events: none;\n    opacity: 0.85;\n  }\n  .hero::before {\n    content: ''; position: absolute; inset: 0;\n    background:\n      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(212,160,23,0.10), transparent 70%),\n      radial-gradient(ellipse 80% 40% at 50% 100%, rgba(212,160,23,0.05), transparent 70%),\n      linear-gradient(180deg, rgba(13,13,13,0) 50%, rgba(13,13,13,0.7) 100%);\n    pointer-events: none;\n    z-index: 1;\n  }\n  .hero-inner { position: relative; z-index: 2; max-width: 980px; margin: 0 auto; text-align: center; }\n  .hero-badge {\n    display: inline-flex; align-items: center; gap: 10px;\n    padding: 8px 16px;\n    border: 1px solid var(--line-strong);\n    border-radius: 999px;\n    background: rgba(212,160,23,0.04);\n    font-family: var(--mono);\n    font-size: 12px;\n    color: var(--gold-light);\n    letter-spacing: 0.04em;\n    margin-bottom: 32px;\n  }\n  .hero-badge .dot {\n    width: 6px; height: 6px; border-radius: 50%;\n    background: var(--gold-light);\n    box-shadow: 0 0 12px var(--gold);\n    animation: pulse 2s infinite;\n  }\n  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }\n  .hero h1 { margin-bottom: 28px; }\n  .hero h1 .accent {\n    font-family: var(--serif);\n    font-style: italic;\n    font-weight: 500;\n    color: var(--gold-light);\n  }\n  .hero .sub { margin: 0 auto 24px; max-width: 760px; }\n  .warn-tag {\n    display: inline-flex; align-items: center; gap: 8px;\n    padding: 8px 16px;\n    background: var(--red-soft);\n    border: 1px solid rgba(199,55,47,0.3);\n    border-radius: 6px;\n    font-size: 13px;\n    color: #E89993;\n    margin-bottom: 40px;\n  }\n  .hero-video {\n    max-width: 880px;\n    margin: 0 auto 36px;\n    border-radius: 14px;\n    overflow: hidden;\n    position: relative;\n    aspect-ratio: 16/9;\n    background: #000;\n    box-shadow:\n      0 0 0 1px var(--line-strong),\n      0 0 60px -10px rgba(212,160,23,0.3),\n      0 30px 80px -20px rgba(0,0,0,0.8);\n  }\n  .hero-video iframe { width: 100%; height: 100%; border: 0; }\n  .hero-video .vthumb {\n    position: absolute; inset: 0;\n    background: #000 center/cover no-repeat;\n    display: grid; place-items: center;\n    cursor: pointer;\n  }\n  .hero-video .vthumb::after {\n    content: '';\n    position: absolute; inset: 0;\n    background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%);\n  }\n  .play-btn {\n    position: relative; z-index: 2;\n    width: 84px; height: 84px;\n    border-radius: 50%;\n    background: rgba(212,160,23,0.95);\n    color: #0D0D0D;\n    display: grid; place-items: center;\n    box-shadow: 0 0 60px rgba(212,160,23,0.4);\n    transition: transform 0.2s;\n  }\n  .play-btn:hover { transform: scale(1.06); }\n  .play-btn svg { width: 32px; height: 32px; margin-left: 4px; }\n\n  .stat-row {\n    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 24px;\n    margin: 0 auto 40px;\n    font-family: var(--mono);\n    font-size: 13px;\n    color: var(--ink-dim);\n    letter-spacing: 0.04em;\n  }\n  .stat-row span { color: var(--gold-light); font-weight: 500; }\n  .stat-row .sep { color: var(--ink-mute); }\n\n  /* ============ DOR ============ */\n  .pain-grid {\n    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));\n    gap: 18px;\n  }\n  .pain-card {\n    background: linear-gradient(180deg, rgba(199,55,47,0.04), rgba(199,55,47,0.01));\n    border: ible.\",\n    \"dor.6\": \"You've considered hiring an editor and designer separately, and discovered the total cost keeps climbing.\",\n    \"dor.close\": \"The question isn't whether you should have a book. It's why you don't have one yet.\",\n\n    \"mech.eyebrow\": \"The Unique Mechanism\",\n    \"mech.title\": \"Before Writing a Single Line,<br/>the Factory <em class=\\\"serif-italic\\\">Researches Everything For You.<\u002Fem>\",\n    \"mech.sub\": \"No text generator does this. Best Seller Factory doesn't invent, it researches, models, and delivers.\",\n    \"mech.s1.title\": \"Real YouTube Research\",\n    \"mech.s1.desc\": \"The platform analyzes the most-watched videos on your topic, reads comments, questions, and suggestions from real audiences, and saves it all as content base.\",\n    \"mech.s2.title\": \"Google Sweep\",\n    \"mech.s2.desc\": \"Next, it maps the main searches, frequent questions, and content trends on Google about your niche.\",\n    \"mech.s3.title\": \"Amazon Top 10\",\n    \"mech.s3.desc\": \"Analyzes Amazon's 10 best-selling books on your topic, titles, synopses, and structures, to model what already works and position your book to sell.\",\n    \"mech.result.label\": \"FINAL RESULT\",\n    \"mech.result.title\": \"Your Professional Book + Full Self-Publishing Kit\",\n    \"mech.result.desc\": \"Based on real research, the platform generates 9 persuasive title suggestions, an Amazon-optimized synopsis, and a complete professional book, ready to publish. In 30 minutes.\",\n\n    \"offer.eyebrow\": \"The Complete Offer\",\n    \"offer.title\": \"Everything You Get<br/>with <em class=\\\"serif-italic\\\">1 Credit at $7.99.<\u002Fem>\",\n    \"offer.col1.title\": \"📖 Complete Book\",\n    \"offer.col1.1\": \"12 complete chapters\",\n    \"offer.col1.2\": \"+170 professional pages\",\n    \"offer.col1.3\": \"Front cover flap copy\",\n    \"offer.col1.4\": \"Back cover copy\",\n    \"offer.col1.5\": \"Back flap copy\",\n    \"offer.col1.
